# Deploy the site to Cloudflare Workers on every push to main.
#
# This exists because Cloudflare's own dashboard-connected build stopped
# running: the last deployment it produced was 33 days old while three merged
# pull requests sat undeployed, with nothing in the repo to show that anything
# was wrong. Keeping the deploy here means it is version-controlled, it shows
# a red X in GitHub the moment it breaks, and it can be re-run from the
# Actions tab without depending on the dashboard.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard → My Profile → API Tokens →
#                          Create Token → "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → the
#                          Account ID shown in the right-hand sidebar.
#
# STRIPE_SECRET_KEY and BLOCKED_IPS are NOT set here. They live in the
# Cloudflare dashboard as Worker secrets/variables and survive deploys.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Never let two deploys race; the newest push wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      # Fails the deploy rather than shipping a build with the database code
      # stripped out — the exact silent failure that made votes look broken
      # for months (Vite inlines VITE_*/constants at build time, so an empty
      # key folds the Supabase client to null and the bundler deletes every
      # database call).
      - name: Verify the database code is in the bundle
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::No Supabase URL in the built bundle — the database client was compiled out."
            exit 1
          fi
          if ! grep -rq "project_votes" dist/assets/*.js; then
            echo "::error::project_votes missing from the bundle — vote code was eliminated."
            exit 1
          fi
          echo "Database code present in the bundle."

      # Guards against ever publishing the Supabase secret / service_role key,
      # which would bypass every Row Level Security policy.
      - name: Verify no secret key is published
        run: |
          if grep -rq "sb_secret_\|service_role" dist/; then
            echo "::error::A Supabase secret key is present in dist/. Refusing to deploy."
            exit 1
          fi
          echo "No secret keys in the build output."

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
