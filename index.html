    <!-- Typography, self-hosted (src/index.css has the @font-face rules):
         Display: Fraunces (variable serif, opsz + wght axes)
         Body:    Plus Jakarta Sans (variable weight)
         Hand:    Architects Daughter (accent for marginalia)
         The two every page paints with first are preloaded; crossorigin is
         required for a font preload to be reused, even from the same origin. -->

    <!-- The homepage hero photo is preloaded by the Worker (a Link header on

    <!-- Bloomerang website visit tracking.

         async, not defer. Deferred scripts run in document order, so a
         deferred tracker placed before the app's module script made the whole
         site wait for api.bloomerang.co: with Bloomerang 3s slow, first paint
         moved from 0.3s to 3.3s. async runs whenever it arrives and holds
         nothing up. A visit recorded a moment later is worth exactly as much.

         ApiKey here is the public web key — browser-facing by design, the
         same class as the Stripe publishable key. Not a private API key. -->
    <script
      src="https://api.bloomerang.co/v1/WebsiteVisit?ApiKey=pub_1e4d92ad-a318-11f1-9e81-0a3f1cc02b7b"
      type="text/javascript"
      async
      onerror="console.warn('[Bloomerang] visit tracking was refused (a 403 here means the public key is not authorised for this domain, or is disabled). Nothing else on the page is affected.')"
    ></script>
